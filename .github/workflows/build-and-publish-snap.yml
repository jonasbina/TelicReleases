name: Rebuild and Publish Snaps to Store

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Deb file from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="jonasbina/TelicReleases"
          
          LATEST_TAG=$(gh release view --repo "$REPO" --json tagName -q ".tagName")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Targeting release: $LATEST_TAG for architecture ${{ matrix.arch }}"
          
          gh release download "$LATEST_TAG" --repo "$REPO" --pattern "*_${{ matrix.arch }}.deb"
          
          mv *_${{ matrix.arch }}.deb telic.deb
          
          VERSION="${LATEST_TAG#v}"
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml

      - name: Build Snap Natively (Official Action)
        uses: snapcore/action-build@v1
        id: snap_build

      - name: Replace Snap file in GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          REPO="jonasbina/TelicReleases"
          echo "Uploading generated snap file(s) to $REPO release $LATEST_TAG..."
          
          gh release upload "$LATEST_TAG" *.snap --repo "$REPO" --clobber

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Publish to Snapcraft Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: |
          for snap_file in *.snap; do
            if [ -f "$snap_file" ]; then
              echo "Publishing $snap_file to Snapcraft..."
              snapcraft upload "$snap_file" --release=stable
            fi
          done
